services:
  api:
    image: langgenius/dify-api:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH}
    depends_on:
      - db
      - redis
      - weaviate
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

  worker:
    image: langgenius/dify-api:latest
    command: ["bash","-lc","celery -A app.celery worker -Q default,agent,paraphrase -l INFO"]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH}
    depends_on:
      - db
      - redis
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

# ... (el resto igual)

volumes:
  db_data:
  weaviate_data:
  storage_data:
