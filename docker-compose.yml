services:
  api:
    image: langgenius/dify-api:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH}
      OPENDAL_SCHEME: ${OPENDAL_SCHEME}
      OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT}
    depends_on:
      - db
      - redis
      - weaviate
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

  web:
    image: langgenius/dify-web:latest
    environment:
      NEXT_PUBLIC_API_URL: http://api:5001
    depends_on:
      - api
    restart: unless-stopped

  worker:
    image: langgenius/dify-api:latest
    command: ["bash","-lc","celery -A app.celery worker -Q default,agent,paraphrase -l INFO"]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL}
      CONSOLE_API_URL: ${CONSOLE_API_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH}
      OPENDAL_SCHEME: ${OPENDAL_SCHEME}
      OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT}
    depends_on:
      - db
      - redis
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

  # ... db, redis, weaviate igual ...

  nginx:
    image: nginx:alpine
    depends_on:
      - web
      - api
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  db_data:
  weaviate_data:
  storage_data:
