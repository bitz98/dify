services:
  api:
    image: langgenius/dify-api:latest
    environment:
      # --- Dify core ---
      SECRET_KEY: 9726ea166dd75de795a6ec129ef205099c2b58ab554a97526faf175057a89c6f
      CONSOLE_WEB_URL: http://localhost
      CONSOLE_API_URL: http://localhost/api
      DATABASE_URL: postgresql://dify:dify@db:5432/dify
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_ENDPOINT: http://weaviate:8080
      # --- Almacenamiento local con OpenDAL (clave del error) ---
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      - db
      - redis
      - weaviate
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

  web:
    image: langgenius/dify-web:latest
    environment:
      # el front habla interno con el servicio "api"
      NEXT_PUBLIC_API_URL: http://api:5001
    depends_on:
      - api
    restart: unless-stopped

  worker:
    image: langgenius/dify-api:latest
    command: ["bash","-lc","celery -A app.celery worker -Q default,agent,paraphrase -l INFO"]
    environment:
      SECRET_KEY: 9726ea166dd75de795a6ec129ef205099c2b58ab554a97526faf175057a89c6f
      CONSOLE_WEB_URL: http://localhost
      CONSOLE_API_URL: http://localhost/api
      DATABASE_URL: postgresql://dify:dify@db:5432/dify
      REDIS_URL: redis://redis:6379/0
      WEAVIATE_ENDPOINT: http://weaviate:8080
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      - db
      - redis
    volumes:
      - storage_data:/app/api/storage
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: dify
      POSTGRES_DB: dify
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server","--save",""]
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.20.0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - web
      - api
    ports:
      - "8081:80"             # si choca, cambia a "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  db_data:
  weaviate_data:
  storage_data:
